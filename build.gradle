plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
}
version = project.mod_version
group = 'dev.rareradar'
base { archivesName = 'rareradar' }
repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly name: 'cobblemon'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
// Minecraft-independent V3 logic lives in core/ (tested on its own with `gradle -p core test`).
// Gson is provided by Minecraft at runtime, so core sources are compiled straight into the mod.
sourceSets { main { java { srcDir 'core/src/main/java' } } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
// Remap the compiled jar explicitly (with Loom 1.8 on Gradle 8.14 remapJar produced an empty jar).
remapJar { inputFile = jar.archiveFile }
