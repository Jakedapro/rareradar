name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Core unit tests (no Minecraft needed)
        run: gradle -p core test
      - name: Type-check Minecraft-facing sources against API stubs
        run: gradle -p tools/stubcheck compileJava
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-test-report, path: core/build/reports/tests/test }

  mod-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Fetch Cobblemon 1.8.2 (Fabric, 1.21.1) as a compile-only dependency
        run: |
          mkdir -p libs
          url=$(curl -fsSL 'https://api.modrinth.com/v2/project/cobblemon/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D' \
            | jq -r '[.[] | select(.version_number | startswith("1.8.2"))][0].files[] | select(.primary) | .url')
          test -n "$url" && test "$url" != "null"
          curl -fsSL "$url" -o libs/cobblemon.jar
      - name: Build mod
        run: gradle build --console=plain 2>&1 | tee build.log
      - name: Diagnostics (task outcomes and outputs, as one annotation)
        if: always()
        run: |
          {
            echo "TASKS:"; grep -E '^> Task' build.log || true
            echo "FILES:"; find build/libs build/devlibs build/classes -maxdepth 6 -type f 2>/dev/null | head -60
            for j in build/libs/*.jar build/devlibs/*.jar; do [ -f "$j" ] && { echo "== $j"; unzip -l "$j" | tail -n +1 | head -15; }; done
            echo "WARN/ERR:"; grep -iE 'warn|error|no-source' build.log | head -30 || true
          } > diag.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' diag.txt)
          echo "::notice title=diag::$msg"
      - name: Report jar contents
        run: |
          ls -la build/libs
          for j in build/libs/*.jar; do
            n=$(unzip -l "$j" | grep -c '\.class$' || true)
            echo "::notice title=jar::$(basename "$j") $(stat -c %s "$j") bytes, $n classes"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rareradar-jar
          path: build/libs/
          if-no-files-found: error
      - name: Refuse to publish an empty jar
        run: |
          j=$(ls build/libs/rareradar-*.jar | grep -v sources | head -1)
          n=$(unzip -l "$j" | grep -c '\.class$' || true)
          echo "$j has $n classes"; test "$n" -gt 10
          for f in assets/rareradar/knowledge/species.json.gz assets/rareradar/knowledge/spawns.json.gz assets/rareradar/knowledge/meta.json fabric.mod.json rareradar.mixins.json dev/rareradar/core/mechanics/CaptureMath.class dev/rareradar/core/mechanics/BallCatalog.class dev/rareradar/core/lab/LabController.class dev/rareradar/lab/LabRuntime.class rareradar-build.properties; do
            unzip -l "$j" | grep -q "$f" || { echo "::error::$f missing from $j"; exit 1; }
          done
      - name: Publish jar to the "dev-latest" pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: RareRadar dev build (latest)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "Untested development build from ${{ github.sha }}. Not yet run in-game: try it in single-player first."
          files: |
            build/libs/rareradar-*.jar
            !build/libs/*-sources.jar
